<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <linearGradient id="mbase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f4ef"/>
      <stop offset="0.45" stop-color="#ebe6dc"/>
      <stop offset="1" stop-color="#d9d2c6"/>
    </linearGradient>
    <filter id="vein" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" baseFrequency="0.015 0.04" numOctaves="5" seed="4" stitchTiles="stitch" result="t"/>
      <feColorMatrix in="t" type="matrix" values="3 -1 -1 0 0.2  3 -1 -1 0 0.18  3 -1 -1 0 0.16  0 0 0 0.55 0"/>
    </filter>
    <filter id="vein2">
      <feTurbulence type="turbulence" baseFrequency="0.008 0.03" numOctaves="3" seed="12" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="2 0 0 0 0.55  2 0 0 0 0.5  2 0 0 0 0.45  0 0 0 0.25 0"/>
    </filter>
  </defs>
  <rect width="320" height="320" fill="url(#mbase)"/>
  <rect width="320" height="320" filter="url(#vein)" opacity="0.45"/>
  <rect width="320" height="320" filter="url(#vein2)" opacity="0.35"/>
</svg>