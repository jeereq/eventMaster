<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="prairieBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a3e635"/>
      <stop offset="0.45" stop-color="#65a30d"/>
      <stop offset="1" stop-color="#3f6212"/>
    </linearGradient>
    <filter id="prairieNoise">
      <feTurbulence type="turbulence" baseFrequency="0.35" numOctaves="4" seed="7" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.48  0 0 0 0 0.12  0 0 0 0.5 0"/>
    </filter>
  </defs>
  <rect width="180" height="180" fill="url(#prairieBase)"/>
  <rect width="180" height="180" filter="url(#prairieNoise)" opacity="0.55"/>
  <circle cx="40" cy="50" r="10" fill="rgba(250,204,21,0.18)"/>
  <circle cx="130" cy="120" r="14" fill="rgba(190,242,100,0.16)"/>
</svg>
